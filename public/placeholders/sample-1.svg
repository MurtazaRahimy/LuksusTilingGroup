<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B5672"/>
      <stop offset="100%" stop-color="#0B4FA8"/>
    </linearGradient>
    <pattern id="tiles" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="none"/>
      <rect x="2" y="2" width="96" height="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#g)"/>
  <rect width="1600" height="1000" fill="url(#tiles)"/>
  <text x="50%" y="92%" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.85)">Sample photo — replace in Admin</text>
</svg>
